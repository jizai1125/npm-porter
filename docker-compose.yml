name: npm-porter

services:
  server:
    image: npm-porter-server:latest
    build:
      context: .
      target: server
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATA_DIR: /data
      DEFAULT_UPSTREAM_REGISTRY: ${DEFAULT_UPSTREAM_REGISTRY:-https://registry.npmjs.org}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      AUTH_VERDACCIO_URL: ${AUTH_VERDACCIO_URL:-http://verdaccio:4873}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    volumes:
      - porter-data:/data
    expose:
      - "3000"
    networks:
      - porter

  web:
    image: npm-porter-web:latest
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${HTTP_PORT:-8080}:80"
    networks:
      - porter

  verdaccio:
    image: verdaccio/verdaccio:6
    restart: unless-stopped
    profiles: ["verdaccio"]
    environment:
      VERDACCIO_PORT: "4873"
    volumes:
      - verdaccio-storage:/verdaccio/storage
    expose:
      - "4873"
    ports:
      - "${VERDACCIO_PORT:-4873}:4873"
    networks:
      - porter

volumes:
  porter-data:
  verdaccio-storage:

networks:
  porter:
